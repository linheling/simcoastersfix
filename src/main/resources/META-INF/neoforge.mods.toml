modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="${neo_version_range}"
type="required"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
type="required"
ordering="NONE"
side="BOTH"

# The blueprint layer is written against simulatedcoasters 0.1.6 (its package-private
# RivetHostIndex / BalloonLoadReconciler / cart link NBT layout). Widen this only after checking a
# new upstream against BLUEPRINT_COMPAT.md's acceptance log.
[[dependencies.${mod_id}]]
modId="simulatedcoasters"
versionRange="[0.1.6,0.1.7)"
type="required"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
versionRange="[2.0.0,)"
type="required"
ordering="AFTER"
side="BOTH"

# Sable Photomancy is what this mod bridges to. It stays optional so upgrading from the 1.x
# performance patch cannot brick a game that does not have Photomancy installed; without it the mod
# loads, logs one line and does nothing.
[[dependencies.${mod_id}]]
modId="sable_schematic_api"
versionRange="[1.0.0,)"
type="optional"
ordering="AFTER"
side="BOTH"
